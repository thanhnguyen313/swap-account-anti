name: Release

# Build installers for macOS, Windows and Linux, then attach them to a
# GitHub Release. Triggered by pushing a version tag (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run dist:mac
          - os: windows-latest
            build: npm run dist:win
          - os: ubuntu-latest
            build: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recreate .env from repo secrets so the build bundles the OAuth client.
      # Add these under: Settings > Secrets and variables > Actions.
      - name: Write .env
        shell: bash
        run: |
          echo "ANTIGRAVITY_CLIENT_ID=${{ secrets.ANTIGRAVITY_CLIENT_ID }}" > .env
          echo "ANTIGRAVITY_CLIENT_SECRET=${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}" >> .env

      - name: Build installer
        run: ${{ matrix.build }}

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
